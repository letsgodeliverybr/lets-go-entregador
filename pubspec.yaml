name: lets_go_entregador
description: Lets Go Delivery app.
publish_to: 'none'
version: 1.0.0+91

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  flutter_map: any
  latlong2: any
  supabase_flutter: any
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.1.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  image_picker: any
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  firebase_core: any
  firebase_messaging: any
  workmanager: ^0.5.2
  wakelock_plus: ^1.1.4
  flutter_foreground_task: ^8.0.0
  shared_preferences: ^2.2.3
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  geolocator_android: ^4.6.1
  geolocator_platform_interface: ^4.2.4
  flutter_launcher_icons: any
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# logo_splash.png (2026-09-08): lockup oficial completo — ícone +
# "@pedeletsgo" + "#CadaKmUmSonho" — já em fundo preto, 1254x1254 (acima
# do canvas de referência de 1152x1152 do Android 12+, evita upscale/
# borrão). Fonte: arquivo de marca "ADESIVO PEDELETSGO.png" do usuário.
# O efeito de zoom na abertura no Android 12+ é do próprio sistema
# operacional (android:windowSplashScreenAnimatedIcon sempre anima),
# não dá pra desativar só por config deste pacote.
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo_splash.png
  android_12:
    color: "#000000"
    image: assets/images/logo_splash.png
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/
