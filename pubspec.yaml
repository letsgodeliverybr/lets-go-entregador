name: lets_go_entregador
description: Lets Go Delivery app.
publish_to: 'none'
version: 1.0.0+93

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  flutter_map: any
  latlong2: any
  supabase_flutter: any
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.1.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  image_picker: any
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  firebase_core: any
  firebase_messaging: any
  workmanager: ^0.5.2
  wakelock_plus: ^1.1.4
  flutter_foreground_task: ^8.0.0
  shared_preferences: ^2.2.3
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  geolocator_android: ^4.6.1
  geolocator_platform_interface: ^4.2.4
  flutter_launcher_icons: any
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Mesma imagem, mesmo tamanho nas duas fases (2026-09-08): confirmado em
# aparelho real que o lockup completo (icone+"@pedeletsgo"+
# "#CadaKmUmSonho") era cortado na fase nativa (zona de segurança circular
# de 288dp da Splash Screen API do Android 12+, doc oficial). Solução:
# logo_icone_texto_circular.png é um lockup horizontal compacto (ícone +
# "Let's Go Delivery") dimensionado pra caber inteiro dentro dessa zona
# (calculado: ~280x69dp no limite teórico do círculo, usado a 237x58dp —
# 85% disso, margem de segurança pra variação de máscara entre
# fabricantes/versões). Mesmo arquivo, mesmo tamanho de exibição (237),
# usado aqui E no AuthGate (lib/main.dart) — sem isso, o "ícone só" da
# fase 1 não tinha como parecer contínuo com o lockup completo da fase 2.
# O efeito de zoom na abertura no Android 12+ é do próprio sistema
# operacional (android:windowSplashScreenAnimatedIcon sempre anima), não
# dá pra desativar só por config deste pacote.
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo_icone_texto_circular.png
  android_12:
    color: "#000000"
    image: assets/images/logo_icone_texto_circular.png
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/
