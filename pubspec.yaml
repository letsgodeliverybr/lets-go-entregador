name: lets_go_entregador
description: Lets Go Delivery app.
publish_to: 'none'
version: 1.0.0+90

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  flutter_map: any
  latlong2: any
  supabase_flutter: any
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.1.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  image_picker: any
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  firebase_core: any
  firebase_messaging: any
  workmanager: ^0.5.2
  wakelock_plus: ^1.1.4
  flutter_foreground_task: ^8.0.0
  shared_preferences: ^2.2.3
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  geolocator_android: ^4.6.1
  geolocator_platform_interface: ^4.2.4
  flutter_launcher_icons: any
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# logo_splash.png é a mesma logo (assets/images/logo.png) com o fundo
# branco removido (a original não tem canal alpha) — sem isso, a splash
# nativa mostraria um quadrado branco atrás da logo em vez do preto que a
# marca usa em todo o resto do app (AuthGate, telas dark).
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo_splash.png
  android_12:
    color: "#000000"
    image: assets/images/logo_splash.png
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/
