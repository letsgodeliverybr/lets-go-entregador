name: lets_go_entregador
description: Lets Go Delivery app.
publish_to: 'none'
version: 1.0.0+92

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  flutter_map: any
  latlong2: any
  supabase_flutter: any
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.1.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  image_picker: any
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  firebase_core: any
  firebase_messaging: any
  workmanager: ^0.5.2
  wakelock_plus: ^1.1.4
  flutter_foreground_task: ^8.0.0
  shared_preferences: ^2.2.3
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  geolocator_android: ^4.6.1
  geolocator_platform_interface: ^4.2.4
  flutter_launcher_icons: any
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Confirmado em aparelho real (2026-09-08): a fase nativa (Android 12+)
# corta o lockup completo — é a "zona de segurança" que a API de splash
# do Android impõe no ícone, mascara/corta o que passar da área central.
# Por isso, aqui (fase 1, restrita) usa SÓ o ícone — logo_icone_splash.png
# (assets/images/logo.png com o fundo branco removido, ainda não tinha
# canal alpha; mesmo processo já usado antes nesta sessão). O lockup
# completo (logo_splash.png, ícone + "@pedeletsgo" + "#CadaKmUmSonho")
# fica só pro AuthGate (lib/main.dart) — lá não tem restrição nenhuma do
# Android, controlamos o layout 100%.
# O efeito de zoom na abertura no Android 12+ é do próprio sistema
# operacional (android:windowSplashScreenAnimatedIcon sempre anima),
# não dá pra desativar só por config deste pacote — vale mesmo só com
# ícone.
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo_icone_splash.png
  android_12:
    color: "#000000"
    image: assets/images/logo_icone_splash.png
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/
